name: Build and deploy Streamlit frontend

on:
  push:
    branches:
      - main
    paths:
      - 'streamlit_app/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install frontend dependencies
        working-directory: streamlit_app
        run: |
          python -m venv antenv
          source antenv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamlit-frontend
          path: |
            streamlit_app/
            !streamlit_app/antenv/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: streamlit-frontend
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C72B39F090A3427CBFA78CD593CA9A8F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_33882018A4E04AA28C313FCA29B346E5 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_65C31D75808047F0A81254F29D2811AE }}

      - name: Deploy Streamlit frontend
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'resumeRoshni-frontend'
          slot-name: 'Production'
